name: mineru-ocr-single-gpu

services:
  mineru-api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.mineru-ocr-api.cuda130
      args:
        MINERU_VLM_BASE_IMAGE: ${MINERU_VLM_BASE_IMAGE:-vllm/vllm-openai:v0.21.0}
    image: mineru-ocr-api-cuda:local
    container_name: mineru-ocr-api-single-gpu-stack
    restart: unless-stopped
    ports:
      - "${MINERU_API_PORT:-8000}:8000"
    environment:
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-huggingface}
      MINERU_API_MAX_CONCURRENT_REQUESTS: ${MINERU_API_MAX_CONCURRENT_REQUESTS:-1}
      MINERU_HYBRID_BATCH_RATIO: ${MINERU_HYBRID_BATCH_RATIO:-1}
      MINERU_PROCESSING_WINDOW_SIZE: ${MINERU_PROCESSING_WINDOW_SIZE:-16}
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --enable-vlm-preload
      - "true"
      - --gpu-memory-utilization
      - "${MINERU_VLLM_GPU_MEMORY_UTILIZATION:-0.5}"
    volumes:
      - ../output/docker-cache/huggingface:/root/.cache/huggingface
      - ../output/docker-cache/modelscope:/root/.cache/modelscope
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${MINERU_API_GPU_COUNT:-1}
              capabilities: [gpu]

  mineru-ocr-webui:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.mineru-ocr-webui
    image: mineru-ocr-webui:local
    container_name: mineru-ocr-webui-single-gpu-stack
    restart: unless-stopped
    depends_on:
      mineru-api:
        condition: service_started
    ports:
      - "${MINERU_WEBUI_PORT:-7861}:7861"
    command:
      - --host
      - 0.0.0.0
      - --port
      - "7861"
      - --api-url
      - http://mineru-api:8000
      - --default-backend
      - hybrid-auto-engine
      - --server-url
      - ""
      - --output-root
      - /data/ocr-webui
      - --default-max-pages-per-chunk
      - "${MINERU_WEBUI_MAX_PAGES_PER_CHUNK:-299}"
    volumes:
      - ../output/ocr-webui:/data/ocr-webui
      # Uncomment and adjust to enable "Batch Directory Path" against host files.
      # - ../demo:/data/input:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7861/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 10s
